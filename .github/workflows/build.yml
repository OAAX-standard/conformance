name: build
# Builds the wheel, checks it in a clean environment and keeps it as a workflow artifact.
# A tag vX.Y.Z (a commit of main) also creates a DRAFT GitHub Release with the wheel, checksums and the CHANGELOG notes: a maintainer reviews and publishes it. Nothing is published to PyPI.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the tag check below needs origin/main
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Build the wheel (reproducible, timestamps fixed to the commit time)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          uv build --wheel --out-dir dist
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: The tag must be on main and match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main: merge first, then tag"; exit 1; }
          version=$(uv run --no-project python -c "import re,pathlib;print(re.search(r'__version__ = .(.+?).$', pathlib.Path('python/oaax_conformance/__init__.py').read_text(), re.M)[1])")
          test "${GITHUB_REF_NAME}" = "v$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Release notes from CHANGELOG.md (dry run on every build; on a tag the heading must be dated)
        shell: bash
        run: |
          version=$(uv run --no-project python -c "import re,pathlib;print(re.search(r'__version__ = .(.+?).$', pathlib.Path('python/oaax_conformance/__init__.py').read_text(), re.M)[1])")
          final=""
          if [ "${GITHUB_REF_TYPE}" = tag ]; then final="--final"; fi
          uv run --no-project python scripts/release_notes.py "$version" dist/SHA256SUMS $final > dist/release-notes.md
          test -s dist/release-notes.md
      - name: Smoke test the wheel in a clean environment (the specs are inside, exit codes work)
        shell: bash
        run: scripts/smoke.sh "$(ls dist/*.whl)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          overwrite: true  # a re-run of the same commit
          name: oaax-conformance-${{ github.sha }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oaax-conformance-${{ github.sha }}
          path: dist
      - name: Create a draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh release view TAG` does not find drafts; the list does. A re-run must not create a second release.
          if gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -qx "$GITHUB_REF_NAME"; then
            echo "a release for $GITHUB_REF_NAME already exists: delete the draft first, or tag a new version"; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS --draft --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
