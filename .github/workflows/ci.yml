name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --python 3.13
      - run: ./scripts/build.sh
      - run: uv run pytest -n 4 -q

  sanitizers:
    # the harness under AddressSanitizer + UBSan: memory errors in the harness itself (oversized names, bad sizes, aliasing) must fail the build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --python 3.13 --no-dev --extra test
      - run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" && cmake --build build-asan -j
      - run: OAAX_BUILD_DIR=build-asan ASAN_OPTIONS=detect_leaks=0 uv run --no-sync pytest -q tests/test_suite.py tests/test_regressions.py -k "clean_mock or default_sizes or oversized or runtime_that_holds or aliased"
