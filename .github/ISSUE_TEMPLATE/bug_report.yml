name: Bug report
description: The suite crashes, blames a runtime or toolchain wrongly, or misses a real problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A check that FAILs a runtime or toolchain correctly is not a bug of the suite: open the issue in that component's repository instead (see the [repository map](https://github.com/OAAX-standard/OAAX/blob/main/CONTRIBUTING.md#contributing-to-oaax-implementations)).
  - type: textarea
    id: what
    attributes:
      label: What did you run, what happened, and what did you expect?
      description: The exact command, the test id and the output (exit code 4 means a bug of the suite). Do not paste values of `--init-config`.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `oaax-conformance --version`
      placeholder: "oaax-conformance 0.1.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, CPU architecture, Python and Docker versions
      placeholder: "Ubuntu 22.04, x86_64, Python 3.13, Docker 27"
