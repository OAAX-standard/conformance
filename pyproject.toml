[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oaax-conformance"
version = "0.1.0"
description = "OAAX conformance suite"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["jsonschema"]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]
onnx = ["onnx"]
e2e = ["onnx", "onnxruntime", "numpy"]

[dependency-groups]
dev = ["oaax-conformance[test,onnx,e2e]"]

[project.scripts]
oaax-conformance = "oaax_conformance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/oaax_conformance"]

[tool.hatch.build.targets.wheel.force-include]
"docs/tests" = "oaax_conformance/test_specs"

[tool.pytest.ini_options]
testpaths = ["tests"]
